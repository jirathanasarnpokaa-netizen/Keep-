<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ECLIPSE CHRONICLE</title>
<style>
:root{--bg:#07050d;--pnl:#120c1f;--pnl2:#1c1233;--gold:#e9c46a;--gold2:#a9822b;--vio:#8a4fff;--crim:#d6264a;--txt:#efe8ff;--mut:#9a8fb5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#winLayer,#winLayer *,#dlg,#dlg *,.screen *{touch-action:pan-y}
input,textarea{touch-action:auto!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:'Segoe UI','Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:14px}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#05030a}
.hidden{display:none!important}
button{font:inherit;color:var(--txt);cursor:pointer;touch-action:manipulation}
input{font:inherit;user-select:text;-webkit-user-select:text;touch-action:auto}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.btn{background:linear-gradient(#2c1b4f,#170d2c);border:1px solid var(--gold2);border-radius:8px;padding:7px 12px;color:var(--gold);font-weight:600;min-height:34px}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:4px 8px;min-height:26px;font-size:12px}
.btn.red{border-color:#d6264a;color:#ff8aa0;background:linear-gradient(#4a1226,#240913)}
.btn.vio{border-color:#8a4fff;color:#cdb4ff}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.btn.on{background:linear-gradient(#7a5a1a,#3d2c0b);color:#fff}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#hudL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;background:linear-gradient(135deg,rgba(18,12,31,.88),rgba(40,16,50,.7));border:1px solid var(--gold2);border-radius:12px;padding:6px 10px 6px 6px;width:min(300px,56vw)}
#portrait{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:#1a1030;flex:none}
.hb{flex:1;min-width:0}
#hName{font-weight:700;font-size:13px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:13px;background:#0b0714;border:1px solid #3a2c55;border-radius:7px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;text-shadow:0 0 3px #000}
.bar.hp i{background:linear-gradient(#ff5470,#a8153a)}
.bar.mp i{background:linear-gradient(#6aa8ff,#2a46b8)}
.bar.ex{height:6px}.bar.ex i{background:linear-gradient(#ffd96a,#b8862a)}
.bar.boss{height:16px;border-color:#d6264a}.bar.boss i{background:linear-gradient(#ff3b5c,#7a0a22)}
#hCur{display:flex;gap:10px;font-size:12px;margin-top:3px;color:var(--gold)}
#hudR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:128px;text-align:right}
#mini{width:116px;height:116px;border:2px solid var(--gold2);border-radius:50%;background:#0a0612;display:block;margin-left:auto;box-shadow:0 0 12px rgba(138,79,255,.4)}
#zoneName{font-size:11px;color:var(--gold);margin-top:2px;text-shadow:0 0 4px #000}
#tracker{position:absolute;right:0;top:152px;width:min(210px,40vw);font-size:11px;background:rgba(10,6,20,.6);border-left:3px solid var(--vio);border-radius:6px;padding:5px 7px;text-align:left;pointer-events:auto}
#tracker b{color:var(--gold)}
#menuBtn{position:absolute;left:max(8px,env(safe-area-inset-left));top:78px;width:40px;height:34px;background:rgba(18,12,31,.88);border:1px solid var(--gold2);border-radius:8px;font-size:18px;color:var(--gold)}
#menuBar{position:absolute;left:max(8px,env(safe-area-inset-left));top:116px;display:none;grid-template-columns:repeat(2,1fr);gap:4px;background:rgba(10,6,20,.92);border:1px solid var(--gold2);border-radius:10px;padding:6px;z-index:5}
#menuBar.open{display:grid}
#menuBar button{background:#1c1233;border:1px solid #4a3a70;border-radius:7px;padding:6px 10px;text-align:left;font-size:13px;white-space:nowrap}
@media(min-width:900px){#menuBtn{display:none}#menuBar{display:flex;top:auto;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));flex-direction:column;grid-template-columns:none;padding:4px;max-height:60vh}#menuBar button{padding:5px 9px;font-size:12px}}
#bossBar{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(380px,42vw);text-align:center}
#bossName{font-weight:700;color:#ff8aa0;text-shadow:0 0 6px #000;font-size:13px}
#prompt{position:absolute;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 76px);transform:translateX(-50%);background:rgba(20,10,40,.92);border:1px solid var(--gold);border-radius:20px;padding:7px 16px;color:var(--gold);font-weight:700;cursor:pointer;white-space:nowrap;z-index:3}
#skillBar{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px}
.slot{position:relative;width:52px;height:52px;border-radius:12px;background:radial-gradient(#2b1c4a,#120a22);border:2px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;cursor:pointer}
.slot.lock{opacity:.35}
.slot .k{position:absolute;left:3px;top:1px;font-size:9px;color:var(--gold)}
.slot .m{position:absolute;right:3px;bottom:1px;font-size:9px;color:#8cc4ff}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);height:0}
.slot.nomp{border-color:#555;filter:saturate(.3)}
.slot.ult{border-color:var(--crim)}
#instInfo{position:absolute;left:50%;top:max(48px,calc(env(safe-area-inset-top) + 48px));transform:translateX(-50%);background:rgba(10,6,20,.8);border:1px solid var(--vio);border-radius:10px;padding:4px 12px;font-size:12px;text-align:center}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;font-size:clamp(22px,5vw,44px);font-weight:800;letter-spacing:3px;color:var(--gold);text-shadow:0 0 18px var(--vio),0 2px 0 #000;opacity:0}
#banner small{display:block;font-size:.4em;letter-spacing:2px;color:#cdb4ff}
#banner.show{animation:ban 3s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.9)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* touch controls */
#touch{position:absolute;inset:0;pointer-events:none;z-index:2}
#touch>*{pointer-events:auto}
#joyZone{position:absolute;left:0;bottom:0;width:48%;height:62%}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(233,196,106,.45);background:rgba(20,10,40,.35);display:none;pointer-events:none}
#joyKnob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(233,196,106,.55);border:2px solid var(--gold)}
.tb{position:absolute;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(#3a2466,#150b28);font-size:22px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.92}
.tb:active,.tb.dn{filter:brightness(1.6)}
#tAtk{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:78px;height:78px;font-size:32px;border-color:var(--crim)}
#tDodge{right:104px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);width:50px;height:50px}
#tBlock{right:96px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);width:46px;height:46px}
#tPot{right:max(18px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);width:46px;height:46px}
#tShadow{right:max(70px,calc(env(safe-area-inset-right) + 62px));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 100px);width:44px;height:44px;font-size:18px}
#tAct{right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 146px);width:44px;height:44px;font-size:18px}
body.notouch #touch{display:none}
#hud>*{z-index:6}
#hud>#banner,#hud>#instInfo{z-index:1}
.slot.dn{filter:brightness(1.8);transform:scale(.93)}
@media(pointer:coarse){#menuBtn{display:block!important}#menuBar{display:none;flex-direction:initial;grid-template-columns:repeat(2,1fr);top:116px;bottom:auto}#menuBar.open{display:grid}.slot{width:46px;height:46px;font-size:21px}#skillBar{left:calc(50% - 20px)}}
@media(pointer:coarse){#tracker{position:fixed;left:max(54px,calc(env(safe-area-inset-left) + 54px));top:78px;right:auto;width:min(210px,34vw);font-size:10.5px}}
@media(max-width:700px) and (orientation:portrait){#skillBar{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 176px);left:calc(50% - 20px)}#prompt{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 210px)}}
/* windows */
#winLayer{position:absolute;inset:0;background:rgba(3,1,8,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:6px}
.win{width:min(780px,98vw);max-height:94vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#150d26,#0b0716);border:2px solid var(--gold2);border-radius:14px;box-shadow:0 0 40px rgba(138,79,255,.45),inset 0 0 30px rgba(138,79,255,.12)}
.wh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #3a2c55;font-weight:800;color:var(--gold);letter-spacing:1px;font-size:16px}
.wh button{background:#3a0f22;border:1px solid var(--crim);border-radius:8px;width:34px;height:30px;color:#ff9db0}
#wb{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1}
.tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.card{background:var(--pnl2);border:1px solid #3a2c55;border-radius:9px;padding:6px 8px;position:relative;font-size:12px}
.card.sel{outline:2px solid var(--gold)}
.card .nm{font-weight:700;font-size:12.5px}
.card .sub{color:var(--mut);font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px dashed #2b2142;padding:2px 0}
.kv b{color:var(--gold)}
.h2{color:var(--gold);font-weight:800;margin:6px 0 4px;font-size:14px}
.mut{color:var(--mut)}.gold{color:var(--gold)}.red{color:#ff8aa0}.grn{color:#7dffa1}.vio{color:#cdb4ff}
.pbar{height:8px;background:#0b0714;border:1px solid #3a2c55;border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(#b48aff,#6a3fd0)}
.tag{display:inline-block;padding:0 6px;border-radius:5px;font-size:10.5px;border:1px solid currentColor;margin-right:3px}
/* dialog */
#dlg{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(700px,97vw);background:linear-gradient(#1a1030,#0c0718);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;z-index:15;box-shadow:0 0 30px rgba(0,0,0,.8)}
#dlg .who{color:var(--gold);font-weight:800;margin-bottom:3px}
#dlg .tx{min-height:42px;font-size:14px;line-height:1.5}
#dlg .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* toasts */
#toasts{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:40;width:90vw}
.toast{background:rgba(14,8,26,.92);border:1px solid var(--gold2);border-radius:18px;padding:4px 14px;font-size:12.5px;animation:tst 3.2s forwards;max-width:92vw;text-align:center}
.toast.err{border-color:var(--crim);color:#ff9db0}.toast.good{border-color:#5fd36b;color:#a8ffb7}.toast.rare{border-color:#b86bff;color:#e2c8ff}.toast.epic{border-color:#ffb52e;color:#ffe29a}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* screens */
.screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#2a1250 0%,#0a0614 55%,#000 100%);overflow:auto;touch-action:pan-y;padding:12px}
#title h1{font-size:clamp(30px,8vw,72px);margin:0;letter-spacing:6px;background:linear-gradient(#fff3c0,#e9c46a 50%,#a9822b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #8a4fff);text-align:center}
#title h2{margin:4px 0 22px;color:#cdb4ff;font-weight:400;letter-spacing:5px;font-size:clamp(11px,2.6vw,18px)}
#title .bt{width:min(280px,80vw);margin:6px;padding:12px;font-size:16px}
.eclipse{position:absolute;width:42vmin;height:42vmin;border-radius:50%;background:#000;box-shadow:0 0 0 3px #e9c46a,0 0 60px 20px rgba(233,196,106,.55),0 0 160px 60px rgba(138,79,255,.5);top:6%;opacity:.55;pointer-events:none;animation:ecl 8s ease-in-out infinite alternate}
@keyframes ecl{from{transform:scale(.95)}to{transform:scale(1.06)}}
#create .box{width:min(820px,98vw);background:rgba(14,8,26,.88);border:2px solid var(--gold2);border-radius:14px;padding:12px}
#create .cols{display:flex;gap:12px;flex-wrap:wrap}
#create canvas{background:radial-gradient(#3a2466,#120a22);border:2px solid var(--gold);border-radius:12px;width:200px;height:240px}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid #444;margin:2px;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 8px #fff}
.opt{margin:3px 0}
.opt label{display:block;color:var(--gold);font-size:12px;margin-bottom:2px}
input.tx{background:#0b0714;border:1px solid var(--gold2);border-radius:8px;color:#fff;padding:8px 10px;width:100%}
#deathScr{background:rgba(60,0,10,.78);z-index:25}
#errScr{background:#100;z-index:60}
.gachaFx{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.88)}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(#fff,#8a4fff 55%,#2a0a60);animation:orb 1.4s ease-in forwards;box-shadow:0 0 60px #8a4fff}
@keyframes orb{0%{transform:scale(.3) rotate(0)}60%{transform:scale(1.2) rotate(360deg)}100%{transform:scale(3);opacity:.1}}
.reveal{animation:rev .6s ease-out backwards}
@keyframes rev{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.glow-m{box-shadow:0 0 14px #ff4d6d,0 0 30px #ff4d6d inset}
.glow-d{box-shadow:0 0 18px #fff2a8,0 0 36px #ffd35a inset;animation:dv 1s infinite alternate}
@keyframes dv{to{filter:brightness(1.5)}}
.anvil{font-size:80px;text-align:center;animation:hm .25s 4}
@keyframes hm{0%{transform:rotate(0)}50%{transform:rotate(-22deg) translateY(-8px)}100%{transform:rotate(0)}}
.flash{animation:fl .6s}
@keyframes fl{0%{background:#fff}100%{background:transparent}}
/* ===== grand UI pass ===== */
#title,#create{background:linear-gradient(rgba(4,2,14,.15),rgba(4,2,14,.5) 70%,rgba(4,2,14,.75))}
.eclipse{display:none}
#title{justify-content:flex-start;padding-top:min(7vh,56px)}
#title h1{font-size:clamp(34px,9vw,84px);line-height:.95;letter-spacing:7px;font-weight:900;background:linear-gradient(#fffbe0 0%,#ffe27a 38%,#e9a83a 62%,#a9622b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1a0a) drop-shadow(0 0 22px rgba(255,170,60,.65)) drop-shadow(0 0 40px rgba(138,79,255,.6));animation:logoPulse 4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 3px 0 #3a1a0a) drop-shadow(0 0 18px rgba(255,170,60,.5)) drop-shadow(0 0 34px rgba(138,79,255,.5))}50%{filter:drop-shadow(0 3px 0 #3a1a0a) drop-shadow(0 0 30px rgba(255,200,90,.85)) drop-shadow(0 0 54px rgba(138,79,255,.8))}}
#title h2{margin:10px 0 18px;color:#f0dcff;font-weight:600;letter-spacing:6px;text-shadow:0 2px 0 #1a0a30,0 0 14px #8a4fff;position:relative}
#title h2:before,#title h2:after{content:'◆';color:#e9c46a;margin:0 12px;font-size:.7em}
#title .bt{width:min(300px,82vw);margin:5px;padding:12px 14px;font-size:16px;letter-spacing:1px;position:relative;overflow:hidden}
#title .bt:after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn{border-radius:4px;border:2px solid #c9a24a;background:linear-gradient(#3a2466,#1b0f36);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.45),0 3px 0 #05020c,0 0 12px rgba(138,79,255,.25);text-shadow:0 2px 0 #000}
.btn:hover{filter:brightness(1.3)}
.btn.red{background:linear-gradient(#6a1a36,#2a0a16)}
.btn.vio{background:linear-gradient(#4a2a8a,#1e1040)}
.win{border:3px solid #c9a24a;border-radius:6px;background:linear-gradient(160deg,#1a1030,#0a0616);box-shadow:0 0 0 2px #0a0510,0 0 0 4px #7a5a1e,0 0 0 6px #0a0510,0 0 50px rgba(138,79,255,.55),inset 0 0 0 2px rgba(233,196,106,.22),inset 0 0 50px rgba(138,79,255,.16)}
.wh{background:linear-gradient(#3e2670,#1a0f33);border-bottom:3px solid #c9a24a;text-shadow:0 2px 0 #000,0 0 10px rgba(255,200,90,.5);font-size:17px;border-radius:3px 3px 0 0}
.wh button{border-radius:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 2px 0 #000}
.card{border-radius:5px;background:linear-gradient(#241540,#170d2c);border:2px solid #4a3a70;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 rgba(0,0,0,.5)}
#hudL{border:2px solid #c9a24a;border-radius:8px;box-shadow:0 0 0 2px #0a0510,0 3px 0 2px #05020c,0 0 22px rgba(138,79,255,.35);background:linear-gradient(135deg,rgba(26,16,48,.94),rgba(48,18,58,.82))}
#portrait{border-radius:6px;border:3px solid #e9c46a;box-shadow:0 0 0 2px #0a0510,0 0 12px rgba(233,196,106,.45);image-rendering:pixelated}
.bar{border-radius:3px;border:2px solid #05020c;box-shadow:0 0 0 1px #4a3a70;height:14px}
.bar:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.3) 11px 12px),linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 45%);pointer-events:none}
.bar i{border-radius:0}
.bar.ex{height:7px}
#mini{box-shadow:0 0 0 2px #0a0510,0 0 0 4px #7a5a1e,0 0 22px rgba(138,79,255,.55);border:2px solid #e9c46a}
.slot{border-radius:6px;border:2px solid #c9a24a;background:radial-gradient(#3a2466,#120a22);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.45),0 3px 0 #05020c,0 0 10px rgba(138,79,255,.3)}
.slot.ult{box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 0 16px rgba(214,38,74,.7),0 3px 0 #05020c}
.tb{box-shadow:inset 0 3px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.45),0 3px 0 #05020c,0 0 14px rgba(138,79,255,.35)}
#menuBar,#menuBtn{border-radius:6px;border:2px solid #c9a24a}
#menuBar button{border-radius:4px;border:2px solid #4a3a70;background:linear-gradient(#2a1a4a,#170d2c);box-shadow:0 2px 0 #05020c}
#tracker{border-left:4px solid #c9a24a;background:linear-gradient(90deg,rgba(26,14,48,.85),rgba(10,6,20,.45));border-radius:0 6px 6px 0}
#prompt{border-radius:6px;border:2px solid #e9c46a;box-shadow:0 3px 0 #05020c,0 0 16px rgba(233,196,106,.4);animation:promptPulse 1.4s ease-in-out infinite}
@keyframes promptPulse{50%{box-shadow:0 3px 0 #05020c,0 0 26px rgba(233,196,106,.75)}}
.toast{border-radius:5px;border-width:2px;box-shadow:0 3px 0 rgba(0,0,0,.6)}

 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.8;this.master.connect(this.ctx.destination);
  this.sg=this.ctx.createGain();this.sg.gain.value=.5;this.sg.connect(this.master);this.mg=this.ctx.createGain();this.mg.gain.value=.10;this.mg.connect(this.master);

 tone(f,d,type,vol,slide,delay,bus){if(!this.ctx)return;try{const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus||this.sg);o.start(t);o.stop(t+d+.03);}catch(e){}},
 noise(d,vol,fq){if(!this.ctx||!this.nbuf)return;try{const c=this.ctx,s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=this.nbuf;f.type='bandpass';f.frequency.value=fq||1000;g.gain.setValueAtTime(vol||.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);s.connect(f);f.connect(g);g.connect(this.sg);s.start();s.stop(c.currentTime+d+.02);}catch(e){}},
 sfx(n){if(!this.ctx||!this.sfxOn)return;const now=performance.now();if(this.last[n]&&now-this.last[n]<45)return;this.last[n]=now;const T=this.tone.bind(this);
  switch(n){

   case'shadow':T(100,.5,'sawtooth',.18,200);T(150,.5,'sine',.15,-60,.1);break;
   case'boom':T(90,.5,'sawtooth',.22,-50);this.noise(.4,.22,500);break;
  }},

  const roots=[220,196,174.6,233,155.6,185,130.8],root=roots[z]||196,sc=[0,3,5,7,10,12,15];

const RAR_BASE=[58,26,11,4.2,0.7,0.08,0.012];
function rollRarity(boost,minR,maxR){
 const w=RAR_BASE.map((b,i)=>b*Math.pow(1+(boost||0)*0.6,i));
 let lo=minR||0,hi=maxR==null?6:maxR;let tot=0;for(let i=lo;i<=hi;i++)tot+=w[i];let r=Math.random()*tot;
 for(let i=lo;i<=hi;i++){r-=w[i];if(r<=0)return i;}return lo;
}
const GEN_BASE={helmet:['Helm','Hood','Circlet'],gloves:['Gauntlets','Gloves','Grips'],boots:['Greaves','Boots','Sabatons'],accessory:['Ring','Amulet','Charm','Pendant']};
function genItem(slot,rar,il,cls,setId,opt){
 opt=opt||{};
 const m=RAR[rar].m,L=Math.max(1,Math.floor(il)),v=()=>0.9+Math.random()*0.2;
 const wc=(slot==='weapon'||slot==='armor')?(cls||pick(CLS_IDS)):null;
 const it={uid:uid(),slot,rar,il:L,enh:0,aff:[],cls:wc,set:setId||null,base:{},el:null,name:''};
 switch(slot){
  case'weapon':it.base.atk=Math.round((6+L*2.4)*m*v());if(rar>=2)it.base.crit=+(m*0.8*v()).toFixed(1);if(rar>=3)it.el=pick(['fire','ice','lightning','wind','light','dark']);break;
  case'helmet':it.base.def=Math.round((2+L*0.7)*m*v());it.base.hp=Math.round((10+L*5)*m*v());break;
  case'armor':it.base.def=Math.round((3+L*1.1)*m*v());it.base.hp=Math.round((20+L*9)*m*v());break;
  case'gloves':it.base.atk=Math.round((2+L*0.8)*m*v());it.base.def=Math.round((1+L*0.4)*m*v());break;
  case'boots':it.base.def=Math.round((1.5+L*0.5)*m*v());it.base.spd=Math.min(30,Math.round(2+m*2.5));break;
  case'accessory':{const pool=[['crit',2*m],['critDmg',8*m],['atkP',.02*m],['hpP',.03*m],['skillP',.03*m],['lifesteal',.006*m],['expP',.03*m],['defP',.025*m]];
    const a=pick(pool);let b=pick(pool);while(b===a)b=pick(pool);
    [a,b].forEach((p,i)=>{it.base[p[0]]=+(p[1]*(i?0.7:1)*v()).toFixed(3);});break;}
 }
 const nAff=[0,1,1,2,2,3,3][rar];for(let i=0;i<nAff;i++)rollAff(it);
 const bn=slot==='weapon'?CLASSES[wc].wn:slot==='armor'?CLASSES[wc].an:pick(GEN_BASE[slot]);
 it.name=(setId?SETMAP[setId].n:pick(PREFIX[rar]))+' '+bn;
 return it;
}
function rollAff(it){
 const L=it.il,m=RAR[it.rar].m,v=()=>0.7+Math.random()*0.4;
 const opts=[['atk',()=>Math.round((2+L*0.6)*m*v())],['def',()=>Math.round((1+L*0.35)*m*v())],['hp',()=>Math.round((15+L*7)*m*v())],
  ['crit',()=>+(1.2*m*v()).toFixed(1)],['aspdP',()=>+(0.012*m*v()).toFixed(3)]];
 const used=it.aff.map(a=>a.k);const av=opts.filter(o=>!used.includes(o[0]));if(!av.length)return null;
 const o=pick(av);const a={k:o[0],v:o[1]()};it.aff.push(a);return a;
}
function itemStats(it){
 const o={},mul=1+0.08*(it.enh||0);
 for(const k in it.base){const v=it.base[k];o[k]=(o[k]||0)+((k==='atk'||k==='def'||k==='hp')?Math.round(v*mul):v);}
 for(const a of it.aff)o[a.k]=(o[a.k]||0)+a.v;return o;
}
function itemValue(it){return Math.round((it.il*18+60)*Math.pow(it.rar+1,1.8)*(1+(it.enh||0)*0.25));}
function itemSell(it){return Math.max(1,Math.floor(itemValue(it)*0.3));}
function fmtStat(k,v){const pc=PCT_KEYS[k];const s=pc?(v*100).toFixed(k==='hpRegen'?2:1)+'%':(Number.isInteger(v)?v:v.toFixed(1))+(k==='crit'||k==='critDmg'?'%':'');return '+'+s;}
function statLine(k,v){return (STAT_L[k]||k)+' '+fmtStat(k,v);}
function dropGear(il,boost,zoneId,minR,maxR,cls){
 const r=rollRarity(boost,minR,maxR);
 const slot=pick(['weapon','weapon','armor','helmet','gloves','boots','accessory','armor']);
 let set=null;const zs=SETS.find(s=>s.z===zoneId);if(zs&&r>=2&&Math.random()<(r>=4?0.6:0.35))set=zs.id;
 else if(r>=3&&Math.random()<.3)set=pick(SETS).id;
 const c=Math.random()<0.8?(cls||G.cls):pick(CLS_IDS);
 return genItem(slot,r,il,c,set);
}

/* ---------- derived stats ---------- */
function petMul(p){const d=PETMAP[p.id];return PET_R[d.r].m*(1+0.04*(p.lv-1))*(1+0.45*p.evo);}
function recalc(){
 const S=G,C=CLASSES[S.cls],b=C.base,g=C.gr,L=S.lv,al=S.alloc;
 const a={atk:b.atk+g.atk*(L-1)+al.str*1.2,def:b.def+g.def*(L-1)+al.vit*0.6+al.agi*0.2,hp:b.hp+g.hp*(L-1)+al.vit*9,mp:b.mp+g.mp*(L-1)+al.int*4,
  crit:b.crit+al.dex*0.25,critDmg:50,aspdP:al.dex*0.003,spd:b.spd+al.agi*0.5,spdP:0,atkP:0,defP:0,hpP:0,mpP:0,expP:0,goldP:0,dropP:0,lifesteal:0,skillP:al.int*0.004,hpRegen:0,mpRegen:2+L*0.12};
 const add=o=>{for(const k in o)a[k]=(a[k]||0)+o[k];};
 const sets={};
 for(const sl of SLOTS){const it=S.eq[sl];if(!it)continue;add(itemStats(it));if(it.set)sets[it.set]=(sets[it.set]||0)+1;}
 for(const id in sets){const s=SETMAP[id],n=sets[id];if(n>=2)add(s.b2);if(n>=4)add(s.b4);if(n>=6)add(s.b6);}
 for(const sk of SKILLS[S.cls]){if(sk.k!=='passive')continue;const lv=S.sk[sk.id]||0;if(lv)for(const k in sk.fx)a[k]=(a[k]||0)+sk.fx[k]*lv;}
 if(S.adv){a.atkP+=.15;a.hpP+=.15;a.defP+=.1;}
 const pet=S.petAct&&S.pets.find(p=>p.uid===S.petAct);
 if(pet){const d=PETMAP[pet.id],m=petMul(pet);for(const k in d.b)a[k]=(a[k]||0)+d.b[k]*m;}
 if(S.guild){for(const p of GUILD_PERKS)if(p.lv<=S.guild.lv)add(p.fx);}
 const st={maxHp:Math.floor(a.hp*(1+a.hpP)),maxMp:Math.floor(a.mp*(1+a.mpP)),atk:a.atk*(1+a.atkP),def:a.def*(1+a.defP),crit:clamp(a.crit,0,80),critDmg:a.critDmg,
  aspd:b.aspd*(1+a.aspdP),spd:Math.min(240,(a.spd)*(1+a.spdP)),skillP:a.skillP,lifesteal:a.lifesteal,hpRegen:a.hpRegen,mpRegen:a.mpRegen,expP:a.expP,goldP:a.goldP,dropP:a.dropP,sets};
 ST=st;S.hp=clamp(S.hp,1,st.maxHp);S.mp=clamp(S.mp,0,st.maxMp);return st;
}
function weaponEl(){const w=G.eq.weapon;return (w&&w.el)||CLASSES[G.cls].el;}
function clsName(){const C=CLASSES[G.cls];return G.adv?C.advN:C.n;}
function addGold(n){G.gold=Math.max(0,Math.floor(G.gold+n));}
function spendGold(n){if(G.gold<n){toast('Gold ไม่พอ','err');Aud.sfx('err');return false;}G.gold-=n;return true;}
function spendGem(n){if(G.gem<n){toast('Gem ไม่พอ','err');Aud.sfx('err');return false;}G.gem-=n;return true;}
function addMat(id,n){if(!MATS[id])return;G.mats[id]=(G.mats[id]||0)+n;if(G.mats[id]<=0)delete G.mats[id];}
function matN(id){return G.mats[id]||0;}
function addItem(it){if(G.inv.length>=INV_MAX){toast('กระเป๋าเต็ม!','err');return false;}G.inv.push(it);return true;}
function findItem(uidv){return G.inv.find(i=>i.uid===uidv);}
function canEquip(it){
 if(!it)return false;
 if((it.slot==='weapon'||it.slot==='armor')&&it.cls&&it.cls!==G.cls){toast('อุปกรณ์นี้ใช้ได้เฉพาะ '+CLASSES[it.cls].n,'err');Aud.sfx('err');return false;}
 return true;
}
function equipItem(uidv){
 const it=findItem(uidv);if(!it||!canEquip(it))return false;
 const old=G.eq[it.slot];G.inv=G.inv.filter(i=>i!==it);G.eq[it.slot]=it;if(old)G.inv.push(old);
 recalc();Aud.sfx('ui');return true;
}
function unequipItem(slot){const it=G.eq[slot];if(!it)return;if(!addItem(it))return;G.eq[slot]=null;recalc();Aud.sfx('ui');}
function sellItem(uidv){const it=findItem(uidv);if(!it)return 0;const v=itemSell(it);G.inv=G.inv.filter(i=>i!==it);addGold(v);Aud.sfx('coin');return v;}
function usePot(kind){
 const order=kind==='hp'?['potS','potM','potL']:['mpS','mpM','mpL'];
 const need_=kind==='hp'?G.hp<ST.maxHp:G.mp<ST.maxMp;
 if(!need_){toast(kind==='hp'?'HP เต็มอยู่แล้ว':'MP เต็มอยู่แล้ว');return false;}
 const id=order.find(k=>matN(k)>0);
 if(!id){toast('ไม่มียา'+(kind==='hp'?' HP':' MP'),'err');Aud.sfx('err');return false;}
 addMat(id,-1);const d=MATS[id];
 if(kind==='hp'){const h=Math.floor(ST.maxHp*d.heal);G.hp=Math.min(ST.maxHp,G.hp+h);if(window.fxText)fxText(RT.x,RT.y-30,'+'+h,'#7dffa1');}
 else{const h=Math.floor(ST.maxMp*d.mp);G.mp=Math.min(ST.maxMp,G.mp+h);if(window.fxText)fxText(RT.x,RT.y-30,'+'+h+' MP','#6aa8ff');}
 Aud.sfx('pick');return true;
}

function saveGame(silent){

 try{

  try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(KEY+'_bak',old);}catch(e){}

 }catch(e){console.error(e);if(!silent)toast('บันทึกไม่สำเร็จ: '+e.message,'err');return false;}
}
const num=(v,d,a,b)=>{v=+v;if(!isFinite(v))return d;return clamp(v,a,b);};
function cleanItem(it){
 if(!it||typeof it!=='object')return null;
 if(!SLOTS.includes(it.slot))return null;
 const r=num(it.rar,0,0,6)|0,il=num(it.il,1,1,200)|0;
 const o={uid:String(it.uid||uid()),slot:it.slot,rar:r,il,enh:num(it.enh,0,0,20)|0,aff:[],cls:(it.cls&&CLASSES[it.cls])?it.cls:null,set:(it.set&&SETMAP[it.set])?it.set:null,
  base:{},el:(it.el&&EL[it.el])?it.el:null,name:String(it.name||'Item').slice(0,40)};
 if((it.slot==='weapon'||it.slot==='armor')&&!o.cls)o.cls='knight';
 if(it.base&&typeof it.base==='object')for(const k in it.base){if(STAT_L[k]&&isFinite(+it.base[k]))o.base[k]=+it.base[k];}
 if(Array.isArray(it.aff))for(const a of it.aff){if(a&&STAT_L[a.k]&&isFinite(+a.v))o.aff.push({k:a.k,v:+a.v});}

function qdef(id){

 let d=MQ.find(x=>x.id===id)||SQ.find(x=>x.id===id);if(d)return d;

  return {id,t:'class',title:'บททดสอบอาชีพ: '+C.n,giver:'aria',lv:10,goals:[{t:'kill',target:'any',n:25,txt:'กำจัดมอนสเตอร์ 25 ตัว'},{t:'boss',target:'any',n:1,txt:'เอาชนะบอส/มินิบอส 1 ตัว'}],
   lines:['ผู้ที่ต้องการเป็น '+C.n+' ('+C.th+') ต้องผ่านบททดสอบ','พิสูจน์ฝีมือด้วยการกำจัดมอนสเตอร์ 25 ตัวและเอาชนะบอสสักตัว แล้วกลับมาหาข้า'],done:['ยอดเยี่ยม! เจ้าผ่านบททดสอบแล้ว เปลี่ยนอาชีพได้ที่ข้าเลย (ค่าธรรมเนียม 3,000 Gold)'],rw:{exp:need(G.lv)*0.3|0,gold:0}};}
 if(id==='adv'){const C=CLASSES[G.cls];
  return {id,t:'class',title:'บททดสอบขั้นสูง: '+C.advN,giver:'aria',lv:30,goals:[{t:'dungeon',target:'any',n:1,txt:'เคลียร์ดันเจี้ยน 1 แห่ง'},{t:'kill',target:'any',n:40,txt:'กำจัดมอนสเตอร์ 40 ตัว'},{t:'boss',target:'any',n:2,txt:'เอาชนะบอส 2 ตัว'}],
   lines:['เส้นทางสู่ '+C.advN+' ต้องผ่านบททดสอบขั้นสูง','เคลียร์ดันเจี้ยน กำจัดศัตรู และโค่นบอส แล้วเจ้าจะได้รับพลังใหม่'],done:['เจ้าคู่ควรแล้ว! ข้าจะปลดผนึกพลังขั้นสูงให้ (ค่าธรรมเนียม 20,000 Gold)'],rw:{exp:need(G.lv)*0.5|0,gold:0}};}
 return null;
}
function qStatus(id){
 if(G.quests.done[id])return 'done';
 const q=G.quests.act[id];if(!q)return 'none';

}
function ensureDaily(){
 const dk=todayKey();if(G.quests.daily&&G.quests.daily.date===dk)return;
 for(const id of Object.keys(G.quests.act))if(id.startsWith('d:'))delete G.quests.act[id];
 G.quests.dailyDone={};
 const rng=srand(hashStr(dk+G.name)),pool=DAILY_POOL.slice();
 for(let i=pool.length-1;i>0;i--){const j=(rng()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
 const L=G.lv,list=pool.slice(0,3).map(p=>({id:'d:'+dk+':'+p.k,t:'daily',title:p.title,giver:'pip',lv:1,goals:p.goals.map(g=>Object.assign({},g)),
  rw:{exp:Math.floor(need(L)*0.5*p.q),gold:Math.floor((300+L*120)*p.q),gem:8},lines:['ภารกิจประจำวัน: '+p.title+' — ทำสำเร็จแล้วมารับรางวัลที่ข้า'],done:['ทำได้ดีมาก! รับรางวัลไปเลย']}));
 G.quests.daily={date:dk,list};
}

 toast('รับเควส: '+d.title,'good');Aud.sfx('ui');
 // retro-count zone goal if already there
 d.goals.forEach((g,i)=>{if(g.t==='zone'&&CUR&&CUR.id===g.target)G.quests.act[id].prog[i]=g.n;});

function matchTarget(g,target,extra){return g.target==='any'||g.target===target||(g.target.startsWith('any:')&&extra&&g.target.slice(4)===extra.zone);}
function onEvent(t,target,n,extra){

  const was=qStatus(id)==='ready';
  d.goals.forEach((g,i)=>{if(g.t===t&&matchTarget(g,target,extra)&&q.prog[i]<g.n)q.prog[i]=Math.min(g.n,q.prog[i]+n);});
  if(!was&&qStatus(id)==='ready'){toast('✔ เควสสำเร็จ: '+d.title+' — ไปรายงานที่ '+(NPCMAP[d.giver]?NPCMAP[d.giver].n:'NPC'),'epic');Aud.sfx('win');}}

function completeQuest(id){

 if(!ids.length){el.innerHTML='<b>เควส</b><br><span class="mut">ไม่มีเควสที่กำลังทำ — คุยกับ NPC ที่มี ❗</span>';return;}

function questsFor(npcId){
 ensureDaily();const out=[];
 for(const d of MQ.concat(SQ)){if(d.giver!==npcId)continue;const s=qStatus(d.id);if(s==='done')continue;if(d.prev&&!G.quests.done[d.prev])continue;out.push({d,s});}
 if(npcId==='pip')for(const d of G.quests.daily.list){if(G.quests.dailyDone[d.id])continue;out.push({d,s:qStatus(d.id)});}
 for(const id in G.quests.act){const d=qdef(id);if(d&&d.giver===npcId&&!out.some(o=>o.d.id===id))out.push({d,s:qStatus(id)});}

/* ---------- progression ---------- */
function gainExp(n){
 if(G.lv>=LVCAP)return;
 n=Math.floor(n*(1+(ST.expP||0)));if(n<=0)return;G.exp+=n;let up=0,old=G.lv;
 while(G.lv<LVCAP&&G.exp>=need(G.lv)){G.exp-=need(G.lv);G.lv++;G.sp++;G.stp+=3;up++;}
 if(G.lv>=LVCAP)G.exp=0;
 if(up){recalc();G.hp=ST.maxHp;G.mp=ST.maxMp;levelUpFx();
  toast('LEVEL UP! Lv.'+G.lv+'  (+'+up+' Skill Point, +'+(up*3)+' Stat Point)','epic');
  for(const s of SKILLS[G.cls])if(s.req>old&&s.req<=G.lv&&s.k!=='adv')toast('ปลดล็อกสกิล: '+s.n,'rare');
  for(const z of ZONES)if(z.req>old&&z.req<=G.lv&&z.req>1)toast('ปลดล็อกพื้นที่ใหม่: '+z.th+' (Lv.'+z.req+')','rare');
  if(old<10&&G.lv>=10)toast('เปลี่ยนอาชีพได้แล้วที่ Class Master Aria!','rare');
  if(old<30&&G.lv>=30)toast('ก้าวสู่อาชีพขั้นสูงได้ที่ Aria!','rare');
  saveGame(true);}
 updHud();
}

 }

 const aggroR=m.tier>=3?230:190;
 if(m.state==='flee'){

  moveToward(m,m.hx,m.hy,m.spd*1.6,dt);m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.25*dt);

 m.cd-=dt;

   else if(k==='shoot'){mProj(m,Math.atan2(tg.y-m.y,tg.x-m.x),230,1,null,{});m.cd=rnd(1.5,2.1);}

   else if(k==='dash'){const a=Math.atan2(tg.y-m.y,tg.x-m.x);m.dash={vx:Math.cos(a)*400,vy:Math.sin(a)*400,t:.45,hit:false,mul:1.3};m.cd=rnd(2.2,3);}
  }

 if(ai==='ranged'||ai==='caster'){

 if(o.slow)m.st.slow=Math.max(m.st.slow,o.slow);
 if(o.dot){}
 if(o.dotD){m.st.dot=3;m.st.dotD=o.dotD;}
 if(o.src!=='pet'&&o.src!=='sold'&&!o.dot){

function updPlayer(dt){
 const R=RT;R.anim+=dt;
 R.atkT-=dt;R.comboT-=dt;if(R.comboT<=0)R.combo=0;
 R.dodgeCd-=dt;R.inv-=dt;R.potCd-=dt;R.castAnim-=dt;R.hitF=Math.max(0,R.hitF-dt);R.combatT+=dt;R.lock=(R.lock||0)-dt;R.slowT=(R.slowT||0)-dt;
 for(let i=0;i<5;i++)if(R.cd[i]>0)R.cd[i]=Math.max(0,R.cd[i]-dt);
 if(R.shieldT>0){R.shieldT-=dt;if(R.shieldT<=0)R.shield=0;}
 if(R.swing){R.swing.t+=dt;if(R.swing.t>=R.swing.d)R.swing=null;}
 if(R.dead)return;
 // regen
 const safe=CUR.z&&CUR.z.safe,ooc=R.combatT>4;
 if(G.hp<ST.maxHp)G.hp=Math.min(ST.maxHp,G.hp+ST.maxHp*((safe?.12:0)+(ooc?.02:0)+.0035+(ST.hpRegen||0))*dt);
 if(G.mp<ST.maxMp)G.mp=Math.min(ST.maxMp,G.mp+(ST.mpRegen*(ooc?1.6:1)+ST.maxMp*(safe?.12:ooc?.02:.006))*dt);
 // keyboard-driven one-shots
 if(pr('dodge'))doDodge();
 if(pr('pot')&&R.potCd<=0){if(usePot('hp'))R.potCd=1;}
 if(pr('mpot')&&R.potCd<=0){if(usePot('mp'))R.potCd=1;}
 for(let i=0;i<5;i++)if(pr('s'+i))useSkill(i);
 if(pr('skill'))useSmart();
 if(pr('extract')){if(!tryExtract())toggleSummon();}
 if(pr('summon'))toggleSummon();
 if(pr('mode'))toggleShMode();
 if(pr('interact')&&NEAR)doInteract(NEAR);
 // knockback & dodge
 if(R.kbx||R.kby){moveEnt(R,R.kbx*dt,R.kby*dt);R.kbx*=Math.pow(.003,dt);R.kby*=Math.pow(.003,dt);if(Math.abs(R.kbx)+Math.abs(R.kby)<10)R.kbx=R.kby=0;}
 if(R.dodgeT>0){R.dodgeT-=dt;moveEnt(R,R.dvx*dt,R.dvy*dt);if(Math.random()<.7)spawnP(R.x,R.y,0,0,.3,4,'#b8c4ff',1,0);R.mv=true;return;}
 // block
 const wantBlock=Input.block&&R.atkT<=.05;
 if(wantBlock&&!R.blocking)R.blockT=0;
 R.blocking=!!wantBlock;if(R.blocking)R.blockT+=dt;
 // move
 let mx=Input.mx,my=Input.my;const ml=Math.hypot(mx,my);
 if(ml>1){mx/=ml;my/=ml;}
 R.mv=ml>.12;
 if(R.mv){
  let sp=ST.spd*(R.blocking?.4:1)*(R.lock>0?.6:1)*(R.slowT>0?.55:1)*Math.min(1,ml);
  moveEnt(R,mx*sp*dt,my*sp*dt);
  if(R.atkT<=0||!R.swing){if(!(R.castAnim>0&&nearestMon(R.x,R.y,200)))R.face=Math.atan2(my,mx);}
 }
 if(R.blocking&&!R.mv){const t=nearestMon(R.x,R.y,300);if(t)R.face=Math.atan2(t.y-R.y,t.x-R.x);}
 R.dir=faceDir();
 // attack
 if(Input.atk&&R.atkT<=0&&!R.blocking)doAttack();
}

/* ===================== PIXEL-ART RENDERER ===================== */
let PXB=null,PXG=null;
function pxCtx(w,h){
 if(!PXB||PXB.width<w||PXB.height<h){const nw=Math.max(w,PXB?PXB.width:0,160),nh=Math.max(h,PXB?PXB.height:0,120);PXB=document.createElement('canvas');PXB.width=nw;PXB.height=nh;PXG=PXB.getContext('2d',{willReadFrequently:true});}
 return PXG;
}
const PXQ=12;
function pxSprite(g,x,y,hw,up,dn,sc,alpha,fn,holder,key,interval){
 const bw=Math.ceil(hw*2),bh=Math.ceil(up+dn),now=performance.now()/1000;
 let src=null;const pc=holder&&holder._pc;
 if(pc&&pc.key===key&&pc.w===bw&&pc.h===bh&&now-pc.t<interval){src=pc.c;}
 else{
  const b=pxCtx(bw,bh);
  b.setTransform(1,0,0,1,0,0);b.globalAlpha=1;b.globalCompositeOperation='source-over';b.clearRect(0,0,bw,bh);
  b.setTransform(1,0,0,1,hw,up);b.save();fn(b);b.restore();b.setTransform(1,0,0,1,0,0);
  const id=b.getImageData(0,0,bw,bh),d=id.data,n=bw*bh;
  for(let i=0;i<n;i++){const o=i<<2;if(d[o+3]<96){d[o+3]=0;continue;}d[o+3]=255;d[o]=Math.round(d[o]/PXQ)*PXQ;d[o+1]=Math.round(d[o+1]/PXQ)*PXQ;d[o+2]=Math.round(d[o+2]/PXQ)*PXQ;}
  const row=bw<<2;
  for(let j=0;j<bh;j++)for(let i=0;i<bw;i++){const o=(j*bw+i)<<2;if(!d[o+3])continue;
   const l=i>0?d[o-1]:0,r=i<bw-1?d[o+7]:0,u=j>0?d[o-row+3]:0,dd=j<bh-1?d[o+row+3]:0;
   if(!l||!r||!u||!dd){d[o]*=.74;d[o+1]*=.74;d[o+2]*=.78;}}
  if(holder){let c=pc&&pc.c;if(!c||c.width!==bw||c.height!==bh){c=document.createElement('canvas');c.width=bw;c.height=bh;}c.getContext('2d').putImageData(id,0,0);holder._pc={c,key,w:bw,h:bh,t:now};src=c;}
  else{b.putImageData(id,0,0);src=PXB;}
 }
 g.save();g.imageSmoothingEnabled=false;if(alpha!=null&&alpha<1)g.globalAlpha*=alpha;
 g.drawImage(src,0,0,bw,bh,Math.round(x)-hw*sc,Math.round(y)-up*sc,bw*sc,bh*sc);g.restore();
}
function drawHeroPx(g,x,y,o){
 const sc=o.sc||1,ik=o.ik||1.4,C=CLASSES[o.cls]||CLASSES.knight,k=sc*ik;
 g.save();g.translate(x,y);g.scale(k,k);
 if(o.adv){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(0,-16,4,0,-16,28);gr.addColorStop(0,C.col+'66');gr.addColorStop(1,C.col+'00');g.fillStyle=gr;g.fillRect(-32,-48,64,64);g.restore();}
 g.fillStyle='rgba(0,0,0,.34)';g.beginPath();g.ellipse(0,1,10,3.6,0,0,6.2832);g.fill();g.restore();
 const o2=Object.assign({},o,{noFx:true,sc:ik,alpha:undefined});
 pxSprite(g,x,y,Math.ceil(66*ik),Math.ceil(68*ik),Math.ceil(14*ik),sc,o.alpha,b=>drawHero(b,0,0,o2),o.holder,o.holder?(o.dir+'|'+o.cls):'',o.holder?.1:0);

/* ===================== ART v2 : articulated humanoids ===================== */
const INK='#140c1e';
function aIK(sx,sy,tx,ty,l1,l2,bend){
 let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const mx=l1+l2-.02;
 if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}if(d<.05)d=.05;
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a)),ux=dx/d,uy=dy/d;
 return [sx+ux*a-uy*h*bend,sy+uy*a+ux*h*bend,sx+dx,sy+dy];
}
function aLimb(g,x1,y1,x2,y2,x3,y3,w1,w2,c1,c2){
 g.lineCap='round';g.lineJoin='round';g.strokeStyle=INK;
 g.lineWidth=w1+1.5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
 g.lineWidth=w2+1.5;g.beginPath();g.moveTo(x2,y2);g.lineTo(x3,y3);g.stroke();
 g.strokeStyle=c1;g.lineWidth=w1;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
 g.strokeStyle=c2;g.lineWidth=w2;g.beginPath();g.moveTo(x2,y2);g.lineTo(x3,y3);g.stroke();
 g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=Math.max(.7,w1*.28);g.beginPath();g.moveTo(x1-w1*.2,y1-.3);g.lineTo(x2-w1*.2,y2-.3);g.stroke();g.beginPath();g.moveTo(x2-w2*.2,y2);g.lineTo(x3-w2*.2,y3-.2);g.stroke();
}
function aGrad(g,x1,y1,x2,y2,c1,c2){const gr=g.createLinearGradient(x1,y1,x2,y2);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr;}
function aPoly(g,p,fill,stroke,lw){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||.8;g.lineJoin='round';g.stroke();}}
function aEll(g,x,y,rx,ry,fill,stroke,lw,rot){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,6.2832);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||.8;g.stroke();}}
function aLine(g,x1,y1,x2,y2,w,c){g.lineCap='round';g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function aGlow(g,x,y,r,c,a){g.save();g.globalAlpha=(a==null?.35:a);g.globalCompositeOperation='lighter';g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();g.globalAlpha*=.55;g.beginPath();g.arc(x,y,r*.55,0,6.2832);g.fill();g.restore();}

const KEYMAP={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
const joy={id:null,cx:0,cy:0,x:0,y:0};
function typing(e){const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');}
window.addEventListener('keydown',e=>{
 if(typing(e))return;
 const k=e.code;
 if(KEYMAP[k]){Input.keys[KEYMAP[k]]=true;e.preventDefault();return;}
 if(!GAME_ON)return;audInit();
 if(k==='Space'){Input.atk=true;e.preventDefault();return;}
 if(e.repeat)return;
 if(G.win){if(k==='Escape'||k===WINKEY[G.win]){closeWin();e.preventDefault();}return;}
 switch(k){
  case'KeyJ':Input.press.skill=true;break;
  case'KeyK':Input.press.dodge=true;break;
  case'ShiftLeft':case'ShiftRight':case'KeyL':Input.block=true;break;
  case'KeyH':Input.press.pot=true;break;
  case'KeyG':Input.press.mpot=true;break;
  case'KeyE':Input.press.interact=true;break;
  case'KeyX':Input.press.extract=true;break;
  case'KeyF':Input.press.summon=true;break;
  case'KeyV':Input.press.mode=true;break;
  case'Digit1':case'Digit2':case'Digit3':case'Digit4':case'Digit5':Input.press['s'+(+k.slice(5)-1)]=true;break;
  case'Escape':openWin('sys');break;
  default:{for(const w in WINKEY)if(WINKEY[w]===k){openWin(w);break;}}
 }
 if(k.startsWith('Digit')||k==='KeyJ'||k==='KeyK')e.preventDefault();
});
window.addEventListener('keyup',e=>{
 const k=e.code;
 if(KEYMAP[k]){Input.keys[KEYMAP[k]]=false;return;}
 if(k==='Space')Input.atk=false;
 if(k==='ShiftLeft'||k==='ShiftRight'||k==='KeyL')Input.block=false;
});
window.addEventListener('blur',()=>{Input.keys={};Input.atk=false;Input.block=false;});
function pollInput(){
 let x=0,y=0;const K=Input.keys;
 if(K.l)x-=1;if(K.r)x+=1;if(K.u)y-=1;if(K.d)y+=1;
 if(joy.id!==null){x+=joy.x;y+=joy.y;}
 Input.mx=x;Input.my=y;
}
function setupTouch(){
 const zone=$('joyZone'),base=$('joyBase'),knob=$('joyKnob');
 const R=60;
 zone.addEventListener('pointerdown',e=>{if(joy.id!==null)return;e.preventDefault();joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;joy.x=joy.y=0;
  base.style.display='block';base.style.left=(joy.cx-60)+'px';base.style.top=(joy.cy-60)+'px';knob.style.left='36px';knob.style.top='36px';try{zone.setPointerCapture(e.pointerId);}catch(_){}audInit();});
 zone.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;e.preventDefault();let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy);
  if(d>R){joy.cx+=dx/d*(d-R);joy.cy+=dy/d*(d-R);base.style.left=(joy.cx-60)+'px';base.style.top=(joy.cy-60)+'px';dx=e.clientX-joy.cx;dy=e.clientY-joy.cy;}
  const dd=Math.hypot(dx,dy)||1,m=Math.min(1,dd/R);joy.x=dx/dd*m;joy.y=dy/dd*m;if(m<.12){joy.x=joy.y=0;}
  knob.style.left=(36+joy.x*40)+'px';knob.style.top=(36+joy.y*40)+'px';});
 const end=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;base.style.display='none';};
 zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);zone.addEventListener('lostpointercapture',end);
 const hold=(id,fn)=>{const b=$(id);let pid=null;
  b.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('dn');fn(true);audInit();});
  const up=e=>{if(pid===null)return;pid=null;b.classList.remove('dn');fn(false);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);};
 const tap=(id,key)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('dn');Input.press[key]=true;audInit();});const up=()=>b.classList.remove('dn');b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);};
 hold('tAtk',v=>{Input.atk=v;});hold('tBlock',v=>{Input.block=v;});
 tap('tDodge','dodge');tap('tPot','pot');tap('tShadow','extract');tap('tAct','interact');
 // mouse attack on canvas
 cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0&&GAME_ON&&!G.win){Input.atk=true;audInit();}if(e.pointerType==='mouse'&&e.button===2){Input.block=true;}});
 window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'){Input.atk=false;if(e.button===2)Input.block=false;}});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 if(!(navigator.maxTouchPoints>0||'ontouchstart' in window))document.body.classList.add('notouch');
 document.addEventListener('gesturestart',e=>e.preventDefault());
 document.addEventListener('dblclick',e=>e.preventDefault());
}

function runAct(el){
 audInit();const parts=el.dataset.act.split(':'),fn=ACT[parts[0]];
 if(fn){try{fn(parts.slice(1));}catch(err){console.error(err);toast('⚠ '+err.message,'err');}return true;}return false;

/* fast touch path: skill slots fire on pointerdown, dialog / death buttons on pointerup.
   (a click is not reliably generated on touch devices while another finger is holding the joystick) */
const FAST_SEL='.slot,#prompt,#dlg [data-act],#deathScr [data-act],#menuBar [data-act],#menuBtn';
let fastLast={t:0,x:0,y:0},fastDown=null;
document.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse')return;
 const el=e.target.closest(FAST_SEL);if(!el)return;
 const ae=el.closest('[data-act]')||el;if(!ae.dataset||!ae.dataset.act)return;
 if(el.classList.contains('slot')){
  e.preventDefault();fastLast={t:performance.now(),x:e.clientX,y:e.clientY};el.classList.add('dn');setTimeout(()=>el.classList.remove('dn'),120);runAct(ae);fastDown=null;return;}
 fastDown={id:e.pointerId,el:ae,x:e.clientX,y:e.clientY};
},true);
document.addEventListener('pointerup',e=>{
 if(!fastDown||e.pointerId!==fastDown.id)return;const fd=fastDown;fastDown=null;
 if(Math.hypot(e.clientX-fd.x,e.clientY-fd.y)>14)return;
 const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!(el===fd.el||fd.el.contains(el)))return;
 fastLast={t:performance.now(),x:e.clientX,y:e.clientY};runAct(fd.el);
},true);
document.addEventListener('pointercancel',e=>{if(fastDown&&e.pointerId===fastDown.id)fastDown=null;},true);
document.addEventListener('click',e=>{
 if(performance.now()-fastLast.t<650&&Math.hypot(e.clientX-fastLast.x,e.clientY-fastLast.y)<60){e.preventDefault();e.stopPropagation();return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(runAct(el))e.preventDefault();
},true);
document.addEventListener('input',e=>{if(e.target.id==='gname')GF.name=e.target.value;if(e.target.id==='crname')CR.name=e.target.value;});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT=0,hudT=0,miniT2=0,saveT=0,errFrames=0;
function frame(ts){
 requestAnimationFrame(frame);
 const el=ts-lastT;if(el<14)return;lastT=ts;const dt=Math.min(.05,el/1000);
 try{
  if(GAME_ON&&CUR&&RT){
   pollInput();
   if(!G.win&&!G.dlg&&!PAUSED)update(dt);
   render();
   updSkillBar();
   hudT+=dt;if(hudT>.12){hudT=0;updBars();updPortrait();if(INST)updHud();}
   miniT2+=dt;if(miniT2>.2){miniT2=0;drawMini($('mini'),116,false);}
   if(!G.win&&!G.dlg&&!PAUSED){G.playtime+=dt;saveT+=dt;if(saveT>5){saveT=0;if(!RT.dead)saveGame(true);}}
   
  }else{render();}
  errFrames=0;
 }catch(e){
  console.error(e);errFrames++;
  if(errFrames===1)toast('⚠ '+e.message,'err');
  if(errFrames>30&&!window.__fatalShown){window.__fatalShown=1;showFatal(e.message+'\n'+(e.stack||''));}
 }
}

});

 requestAnimationFrame(t=>{lastT=t;frame(t);});
 // unlock audio on first gesture
 const un=()=>{audInit();};window.addEventListener('pointerdown',un,{once:true});window.addEventListener('keydown',un,{once:true});
}
try{boot();}catch(e){console.error(e);showFatal(e.message);}
